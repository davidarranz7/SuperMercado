<h1>Productos</h1>

<input #buscadorInput type="text" placeholder="Buscar productos..." (input)="busqueda.set(buscadorInput.value)">

<div class="categorias">
    @for (cat of categorias; track cat) {
        <button [class.activo]="categoriaActiva() === cat" (click)="categoriaActiva.set(cat)">{{ cat }}</button>
    }
</div>

<div class="grid-productos">
    @for (producto of productosFiltrados(); track producto.id) {
        <app-producto-card [producto]="producto" />
    }
</div>
