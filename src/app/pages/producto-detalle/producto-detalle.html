<div class="producto-detalle">
  @if (cargando()) {
    <p>Cargando producto...</p>
  } @else if (error()) {
    <p>{{ error() }}</p>
  } @else if (producto(); as producto) {
    <span>{{ producto.icono }}</span>
    <p>{{ producto.categoria }}</p>
    <h1>{{ producto.nombre }}</h1>
    <p>{{ producto.precio }} €</p>
  }
</div>
